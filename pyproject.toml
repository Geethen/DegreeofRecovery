
[project]
authors = [
  {name = "ninanor", email = "ninanor@nina.no"}
]
# PEP 621 project metadata
# See https://www.python.org/dev/peps/pep-0621/
dependencies = [
  "django-environ",
  "numpy",
  "pandas",
  "scipy",
  "matplotlib",
  "svgpath2mpl",
  "duckdb",
  "earthengine-api",
  "geopandas",
  "shapely",
  "scikit-learn",
  "tqdm",
  "requests",
  "cartopy",
  "pyarrow",
  "typer",
]
description = "Satellite-based degree-of-recovery framework for RECOVER restoration test sites."
license = "GPL-3.0+"
name = "degree_of_recovery"
readme = "README.md"
requires-python = ">=3.10"
version = "0.1.0"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/degree_of_recovery"]

[project.scripts]
degree_of_recovery = "main:start"

[dependency-groups]
dev = [
  "deptry",
  "pre-commit",
  "pytest",
  "ruff",
  "marimo",
]

[tool.deptry]
known_first_party = ["degree_of_recovery"]

[tool.ruff]
fix = true
extend-exclude = ["scratch", "__marimo__", "v1", "v2", "v3", "v4"]

[tool.ruff.lint]
ignore = ["COM812"]
select = ["E", "W", "I", "F", "UP", "S", "B", "A", "COM", "LOG", "PTH", "Q"]

[tool.pytest.ini_options]
testpaths = ["tests"]
