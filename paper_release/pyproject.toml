[project]
authors = [
  {name = "ninanor", email = "ninanor@nina.no"}
]
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "matplotlib",
  "duckdb",
  "geopandas",
  "shapely",
  "scikit-learn",
  "pyarrow",
]
description = "Degree-of-Recovery (DoR) test-site scoring — reproduction package for the RECOVER restoration paper."
license = "GPL-3.0+"
name = "degree_of_recovery_paper"
readme = "README.md"
requires-python = ">=3.10"
version = "0.1.0"

[project.optional-dependencies]
# Only needed for the optional from-scratch Earth Engine extraction steps
# (01, 02a, 02b, 06). Not required to reproduce the paper's scored result
# from the shipped/downloaded cached data.
gee = [
  "earthengine-api",
  "tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/degree_of_recovery"]
